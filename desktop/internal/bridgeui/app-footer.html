<footer class="app-footer">
  {{if .QuitURL}}
  <p class="subtitle" data-message="keep_tab_open">{{.Messages.keep_tab_open}}</p>
  <a id="quit-link" class="link-btn" href="{{.QuitURL}}?lang={{.Language}}" data-preserve-lang data-message="quit">{{.Messages.quit}}</a>
  {{end}}
  <div class="footer-links">
    {{range $i, $link := .FooterLinks}}
    {{if $i}}<span aria-hidden="true">·</span>{{end}}
    <a href="{{$link.URL}}" target="_blank" rel="noopener noreferrer">
      {{if eq $link.Icon "globe"}}
      <svg class="footer-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c-5 5-5 13 0 18 5-5 5-13 0-18Z"/></svg>
      {{else if eq $link.Icon "github"}}
      <svg class="footer-icon" aria-hidden="true" viewBox="0 0 24 24" fill="currentColor"><path d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.11.79-.25.79-.56 0-.27-.01-1.17-.02-2.12-3.2.69-3.88-1.36-3.88-1.36-.52-1.33-1.28-1.68-1.28-1.68-1.05-.71.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.76 2.7 1.25 3.36.96.1-.75.4-1.25.73-1.54-2.55-.29-5.24-1.28-5.24-5.68 0-1.26.45-2.28 1.19-3.09-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.16 1.18a10.9 10.9 0 0 1 5.76 0c2.19-1.49 3.16-1.18 3.16-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.83 1.19 3.09 0 4.41-2.69 5.39-5.26 5.67.42.36.79 1.07.79 2.16 0 1.56-.01 2.82-.01 3.2 0 .31.21.67.8.56A11.51 11.51 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5Z"/></svg>
      {{end}}
      <span data-message="{{$link.MessageKey}}">{{$link.Label}}</span>
    </a>
    {{end}}
  </div>
</footer>
