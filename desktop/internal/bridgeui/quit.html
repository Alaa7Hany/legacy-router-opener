<!DOCTYPE html>
<html lang="{{.Language}}" dir="{{.Direction}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{{if .Token}}{{.Messages.quit_title}}{{else}}{{.Messages.stopped_title}}{{end}}</title>
  <style>{{.CSS}}</style>
</head>
<body>
  <main class="card">
    {{if .Token}}
    <header class="header">
      <h1>{{.Messages.quit_title}}</h1>
      <p class="subtitle">{{.Messages.quit_help}}</p>
    </header>
    <form method="post" action="/quit?lang={{.Language}}">
      <input type="hidden" name="token" value="{{.Token}}">
      <button class="primary-btn" type="submit">{{.Messages.quit}}</button>
    </form>
    <footer class="app-footer"><a class="link-btn" href="{{.OpenerURL}}">{{.Messages.cancel}}</a></footer>
    <script src="/quit/watch.js" defer></script>
    {{else}}
    <h1>{{.Messages.stopped_title}}</h1>
    <p class="subtitle">{{.Messages.stopped_help}}</p>
    {{end}}
  </main>
</body>
</html>
