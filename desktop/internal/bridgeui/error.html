<!DOCTYPE html>
<html lang="{{.Language}}" dir="{{.Direction}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title data-message="error_title">{{.Messages.error_title}}</title>
  <style>{{.CSS}}</style>
</head>
<body>
  <main class="card">
    <header class="header">
      <div class="title-row">
        <h1 data-message="error_title">{{.Messages.error_title}}</h1>
        {{template "language-switch.html" .}}
      </div>
      <p class="subtitle"><span data-message="device_address">{{.Messages.device_address}}</span> <bdi dir="ltr">{{.Target}}</bdi></p>
      <p class="recovery-hint" data-message="error_help">{{.Messages.error_help}}</p>
    </header>
    <div class="error-actions">
      <button id="retry-btn" type="button" class="primary-btn" data-message="try_again">{{.Messages.try_again}}</button>
      <a id="try-another-link" href="{{.OpenerURL}}?edit=1&amp;lang={{.Language}}" class="secondary-btn" data-preserve-lang data-message="try_another_address">{{.Messages.try_another_address}}</a>
    </div>
    <div class="disclosures">
      <details>
        <summary data-message="technical_details">{{.Messages.technical_details}}</summary>
        <pre dir="ltr" lang="en">{{.Message}}</pre>
      </details>
    </div>
    <footer class="app-footer"><a id="back-to-opener-link" href="{{.OpenerURL}}?lang={{.Language}}" class="link-btn" data-preserve-lang data-message="back_to_opener">{{.Messages.back_to_opener}}</a></footer>
  </main>
  <script id="messages" type="application/json">{{.Catalog}}</script>
  <script>{{.JS}}</script>
</body>
</html>
