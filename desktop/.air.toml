# Air configuration for hot-reloading the desktop module during development.
# Install: go install github.com/air-verse/air@latest
# Run:     air
root = "."
tmp_dir = "tmp"

[build]
  cmd = "GOTOOLCHAIN=auto go build -o ./tmp/legacy-router-opener ."
  entrypoint = "./tmp/legacy-router-opener"
  args_bin = ["--no-browser"]
  delay = 1000
  exclude_dir = ["tmp", "docs", "legacy", "winres"]
  include_ext = ["go", "html", "css", "js", "json"]
  exclude_regex = ["_test\\.go"]
  stop_on_error = true
  send_interrupt = true
  kill_delay = 500

[log]
  time = true

[misc]
  clean_on_exit = true
